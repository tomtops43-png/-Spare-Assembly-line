name: Deploy to Apps Script

# push โค้ดในโฟลเดอร์ gas/ ขึ้น Google Apps Script อัตโนมัติทุกครั้งที่โค้ดเข้า main
# ตั้งค่าครั้งเดียวตาม README (secret CLASPRC_JSON / DEPLOYMENT_ID / SCRIPT_ID)
# ถ้าโค้ด GAS อยู่โฟลเดอร์อื่น: แก้ทั้ง paths ข้างล่าง และ GAS_DIR
on:
  push:
    branches:
      - main
    paths:
      - 'gas/**'
      - '.github/workflows/deploy-appsscript.yml'
  workflow_dispatch:

permissions:
  contents: read

# กัน deploy ซ้อนกัน — ตัวใหม่รอตัวเก่าเสร็จก่อน (ไม่ยกเลิกกลางทาง เดี๋ยวโค้ดบน Apps Script ค้างครึ่งๆ)
concurrency:
  group: deploy-appsscript
  cancel-in-progress: false

env:
  TZ: Asia/Bangkok
  GAS_DIR: gas

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests (ถ้ามี)
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "ไม่มี package.json — ข้ามเทสต์"
          fi

      # หน้าเว็บบน GitHub Pages เรียก /exec โดยไม่ได้ล็อกอิน Google → web app ต้องเปิด "Anyone"
      # ถ้าตั้งเป็นค่าอื่น request จะโดนเด้งไปหน้า login แล้วเบราว์เซอร์รายงานเป็น CORS error
      # (ถ้าตั้งใจให้ต้องล็อกอินจริงๆ ลบ step นี้ทิ้งได้)
      - name: Verify web app stays public
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.env.GAS_DIR + "/appsscript.json", "utf8"));
            const w = m.webapp || {};
            const errs = [];
            if (w.access !== "ANYONE_ANONYMOUS") errs.push("webapp.access ต้องเป็น ANYONE_ANONYMOUS (ตอนนี้: " + w.access + ")");
            if (w.executeAs !== "USER_DEPLOYING") errs.push("webapp.executeAs ต้องเป็น USER_DEPLOYING (ตอนนี้: " + w.executeAs + ")");
            if (errs.length) { errs.forEach(e => console.error("::error::" + e)); process.exit(1); }
            console.log("webapp: access=" + w.access + ", executeAs=" + w.executeAs + " ✓");
          '

      - name: Check secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::ยังไม่ได้ใส่ secret CLASPRC_JSON — ทำตามขั้นตอนใน README ก่อน"
            exit 1
          fi

      - name: Install clasp
        # ตรึงแค่ major — clasp คนละ major เขียน ~/.clasprc.json คนละรูปแบบ
        run: npm install -g @google/clasp@3

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          # ใส่ SCRIPT_ID ไว้ใน secret จะใช้ค่านั้น ไม่งั้นใช้ scriptId ที่ commit ไว้ใน gas/.clasp.json
          if [ -n "$SCRIPT_ID" ]; then
            printf '{"scriptId":"%s"}' "$SCRIPT_ID" > "$GAS_DIR/.clasp.json"
          fi
          node -e '
            const c = require("./" + process.env.GAS_DIR + "/.clasp.json");
            if (!c.scriptId || c.scriptId.indexOf("ใส่") === 0) { console.error("::error::ไม่พบ scriptId — ใส่ใน gas/.clasp.json หรือ secret SCRIPT_ID"); process.exit(1); }
          '

      - name: Push code to Apps Script
        working-directory: ${{ env.GAS_DIR }}
        run: clasp push --force

      - name: Update web app deployment
        working-directory: ${{ env.GAS_DIR }}
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::ไม่ได้ใส่ DEPLOYMENT_ID — push ขึ้น HEAD อย่างเดียว (URL /exec จะยังเป็นโค้ดเวอร์ชันเก่า)"
            exit 0
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
