name: Tests

# รันเทสต์บน PR ก่อน merge — ส่วน push เข้า main มี job test ใน deploy-pages.yml คุมอยู่แล้ว
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# runner ของ GitHub เป็น UTC แต่ระบบนี้ใช้งานที่โรงงานไทย และ Backend.gs
# fix timezone เป็น Asia/Bangkok ทุกจุด — ถ้าไม่ pin ตรงนี้ เทสต์ที่เกี่ยวกับเวลาจะเพี้ยน 7 ชม.
env:
  TZ: Asia/Bangkok

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test
