name: Deploy to Apps Script

# push โค้ด scr/ ขึ้น Google Apps Script อัตโนมัติทุกครั้งที่โค้ดเข้า main
# ตั้งค่าครั้งเดียวตาม DEPLOYMENT.md (secret CLASPRC_JSON / SCRIPT_ID / DEPLOYMENT_ID)
on:
  push:
    branches:
      - main
    paths:
      - 'scr/**'
      - '.github/workflows/deploy-appsscript.yml'
  workflow_dispatch:

permissions:
  contents: read

# กัน deploy ซ้อนกัน — ตัวใหม่รอตัวเก่าเสร็จก่อน (ไม่ยกเลิกกลางทาง เดี๋ยวโค้ดบน Apps Script ค้างครึ่งๆ)
concurrency:
  group: deploy-appsscript
  cancel-in-progress: false

env:
  TZ: Asia/Bangkok

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      # web app ต้องเปิด "ทุกคนที่มีลิงก์" — ถ้าใครแก้ appsscript.json เป็นค่าอื่น แอปหน้างานจะพังทั้งหมด
      # (request โดนเด้งไปหน้า login แล้วเบราว์เซอร์รายงานเป็น CORS error) จึงให้ deploy ล้มดังๆ แทน
      - name: Verify web app stays public
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("scr/appsscript.json", "utf8"));
            const w = m.webapp || {};
            const errs = [];
            if (w.access !== "ANYONE_ANONYMOUS") errs.push("webapp.access ต้องเป็น ANYONE_ANONYMOUS (ตอนนี้: " + w.access + ")");
            if (w.executeAs !== "USER_DEPLOYING") errs.push("webapp.executeAs ต้องเป็น USER_DEPLOYING (ตอนนี้: " + w.executeAs + ")");
            if (errs.length) { errs.forEach(e => console.error("::error file=scr/appsscript.json::" + e)); process.exit(1); }
            console.log("webapp: access=" + w.access + ", executeAs=" + w.executeAs + " ✓");
          '

      - name: Check secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::ยังไม่ได้ใส่ secret CLASPRC_JSON — ทำตามขั้นตอนใน DEPLOYMENT.md ก่อน"
            exit 1
          fi

      - name: Install clasp
        # ตรึงแค่ major — clasp คนละ major เขียน ~/.clasprc.json คนละรูปแบบ
        run: npm install -g @google/clasp@3

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          # ใส่ SCRIPT_ID ไว้ใน secret จะใช้ค่านั้น ไม่งั้นใช้ scriptId ที่ commit ไว้ใน scr/.clasp.json
          if [ -n "$SCRIPT_ID" ]; then
            printf '{"scriptId":"%s"}' "$SCRIPT_ID" > scr/.clasp.json
          fi
          node -e 'const c = require("./scr/.clasp.json"); if (!c.scriptId) { console.error("::error::ไม่พบ scriptId"); process.exit(1); }'

      - name: Push code to Apps Script
        working-directory: scr
        run: clasp push --force

      - name: Update web app deployment
        working-directory: scr
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::ไม่ได้ใส่ DEPLOYMENT_ID — push ขึ้น HEAD อย่างเดียว (URL /exec ที่ตรึงเวอร์ชันไว้จะไม่อัปเดต)"
            exit 0
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub Actions ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
